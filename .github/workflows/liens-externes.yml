# Vérification hebdomadaire des liens vers les sites externes (GBIF, Wikipédia, UICN…)
# dans la documentation. Séparée des vérifications de chaque envoi, parce qu'un site
# tiers peut être momentanément indisponible sans que ce soit de notre fait.

name: Liens externes

on:
  schedule:
    - cron: "0 6 * * 1" # chaque lundi à 6 h UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liens-externes:
    name: Liens externes de la documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --max-retries 3
            './**/*.md'
          fail: true
        env:
          # Évite la limite de requêtes de GitHub pour les liens vers github.com.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
