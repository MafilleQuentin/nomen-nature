# Déploiement du site de test (https://test.nomenature.org) : à chaque fusion dans develop,
# après chaque import mensuel réussi, ou à la main. Le paquet de données de la dernière release
# « donnees-AAAA-MM » est installé avant la construction.
#
# Secrets : CLOUDFLARE_API_TOKEN (jeton limité au déploiement des Workers, créé par
# l'utilisateur) et CLOUDFLARE_ACCOUNT_ID (identifiant du compte Cloudflare).
# Le vrai site (nomenature.org) aura son propre déploiement à l'ouverture (lot 10).

name: Déploiement du site de test

on:
  push:
    branches: [develop]
  workflow_run:
    workflows: ["Données mensuelles"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploiement-test
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"

jobs:
  deployer:
    name: Construction et déploiement
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Données (dernière release « donnees-AAAA-MM »)
        run: npm run donnees:installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Construction et déploiement (Wrangler)
        run: npm run deploy:test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Vérification en ligne
        run: |
          for chemin in /fr /en /donnees/recherche/manifeste.json /donnees/sources.json; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://test.nomenature.org$chemin")
            echo "$chemin : $code"
            test "$code" = 200
          done
